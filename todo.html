<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>React To-Do App</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              coral: "#FF6F61",
              mustard: "#FFD447",
              dark: "#1C1C1C",
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-coral flex justify-center items-center min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      function Task({ task, onToggle, onDelete }) {
        return (
          <li className="flex items-center justify-between bg-white/90 px-4 py-3 mb-2 rounded-xl shadow-sm hover:bg-white transition">
            <div className="flex items-center gap-3 flex-1">
              <input
                type="checkbox"
                checked={task.isDone}
                onChange={onToggle}
                className="w-5 h-5 accent-mustard cursor-pointer"
              />
              <span
                onClick={onToggle}
                className={`cursor-pointer select-none ${
                  task.isDone
                    ? "line-through text-gray-400"
                    : "text-dark font-semibold"
                }`}
              >
                {task.title}
              </span>
            </div>

            <button
              onClick={onDelete}
              className="ml-3 px-3 py-1 bg-dark text-white rounded-lg text-sm hover:bg-black transition"
            >
              Delete
            </button>
          </li>
        );
      }

      function App() {
        const [tasks, setTasks] = React.useState([
          { title: "Learn ReactJS", isDone: false },
          { title: "Watch One Punch Man", isDone: false },
          { title: "Cook Dinner", isDone: false },
        ]);
        const [newTask, setNewTask] = React.useState("");
        const [error, setError] = React.useState("");

        const addTask = () => {
          if (newTask.trim() === "") {
            setError("Please enter a task before adding.");
            return;
          }
          setTasks([...tasks, { title: newTask.trim(), isDone: false }]);
          setNewTask("");
          setError("");
        };

        const toggleTask = (index) => {
          const updated = [...tasks];
          updated[index].isDone = !updated[index].isDone;
          setTasks(updated);
        };

        const deleteTask = (index) => {
          setTasks(tasks.filter((_, i) => i !== index));
        };

        return (
          <div className="bg-white/95 shadow-xl rounded-2xl p-6 w-96 border-2 border-dark">
            <h2 className="text-3xl font-extrabold text-center text-dark mb-5 drop-shadow-md">
              📝 My To-Do List
            </h2>

            <div className="flex mb-2">
              <input
                type="text"
                value={newTask}
                onChange={(e) => {
                  setNewTask(e.target.value);
                  setError("");
                }}
                placeholder="Enter new task..."
                className="flex-1 px-3 py-2 border border-dark text-dark bg-white rounded-l-lg focus:outline-none focus:ring-2 focus:ring-mustard placeholder-gray-400"
              />
              <button
                onClick={addTask}
                className="px-4 py-2 bg-dark text-mustard rounded-r-lg hover:bg-black transition font-medium"
              >
                Add
              </button>
            </div>

            {error && (
              <p className="text-red-600 text-sm mb-3 text-center">{error}</p>
            )}

            <ul>
              {tasks.map((task, index) => (
                <Task
                  key={index}
                  task={task}
                  onToggle={() => toggleTask(index)}
                  onDelete={() => deleteTask(index)}
                />
              ))}
            </ul>

            {tasks.length === 0 && (
              <p className="text-center text-gray-500 mt-4">
                No tasks yet. Add one!
              </p>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
